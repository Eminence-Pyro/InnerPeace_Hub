{% extends "base.html" %}

{% block title %}Something Went Wrong — InnerPeace Hub{% endblock %}

{% block content %}
<section class="error-page">
  <div class="container">
    <div class="error-content">
      <h1 class="error-code">500</h1>
      <h2 class="error-title">Something Went Wrong</h2>
      <p class="error-message">We hit an unexpected bump on the road to peace. Our team has been notified. Please try again shortly.</p>
      <a href="{{ url_for('blog.index') }}" class="btn-primary">
        <i class="fas fa-home"></i> Back to Home
      </a>
    </div>
  </div>
</section>
{% endblock %}
